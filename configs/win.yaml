# Win-probability model (python -m sts2_advisor.win --config configs/win.yaml --pick-model models/card_pick)

data:
  offers: data/processed/offers.parquet

# Keep identical to configs/train.yaml so both models share the same test sets.
split:
  test_frac: 0.2
  valid_frac: 0.1
  seed: 0
  hold_out_mine: true

# Give the model the deck's actual cards: one copy-count column per card, for
# the most common N cards in training decks (0 = deck summarized by counts only).
features:
  deck_cards: 250

model:
  objective: binary
  metric: binary_logloss
  learning_rate: 0.05
  num_leaves: 63
  min_data_in_leaf: 200
  feature_fraction: 0.9
  num_boost_round: 3000
  early_stopping_rounds: 50

# Reliability check (needs --pick-model). Win chances for options players rarely
# take are pulled toward the reward's typical outcome: an option keeps
# p / (p + shrink_k) of its difference, where p = how often players take it.
reliability:
  shrink_k: 0.05
  low_confidence_below: 0.05  # flag options players take less often than this
  tie_margin: 0.01            # options within this of the best count as tied

output:
  model_dir: models/win_prob

mlflow:
  enabled: true
  db_path: mlruns/mlflow.db
  artifact_dir: mlruns/artifacts
  experiment: win-prob
